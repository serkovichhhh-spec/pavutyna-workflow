name: TYAMA Cloudflare foundation

on:
  push:
    branches: [main]
    paths:
      - 'tyama-cloudflare/**'
      - '.github/workflows/tyama-cloudflare-check.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tyama-cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install
      - name: Validate foundation
        id: validate
        shell: bash
        run: |
          set +e
          {
            npx wrangler types
            npx tsc --noEmit
            npx wrangler d1 migrations apply tyama-core --local
            npx wrangler deploy --dry-run
          } 2>&1 | tee ../tyama-cloudflare-check.log
          code=${PIPESTATUS[0]}
          if [ "$code" -eq 0 ]; then status=PASS; else status=FAIL; fi
          printf '{"status":"%s","sha":"%s","run_id":"%s","updated_at":"%s"}\n' "$status" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ../.tyama-cloudflare-check.json
          tail -n 160 ../tyama-cloudflare-check.log > ../.tyama-cloudflare-check.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish result
        working-directory: .
        run: |
          git config user.name 'tyama-ci'
          git config user.email 'tyama-ci@users.noreply.github.com'
          git add .tyama-cloudflare-check.json .tyama-cloudflare-check.log
          git diff --cached --quiet || git commit -m 'Update TYAMA Cloudflare check status'
          git push
      - name: Fail when validation fails
        if: steps.validate.outputs.exit_code != '0'
        working-directory: .
        run: exit 1
