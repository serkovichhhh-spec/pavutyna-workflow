name: TYAMA Cloudflare remote bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tyama-cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Cloudflare credentials are configured
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - name: Install
        run: npm install
      - name: Validate locally before remote mutation
        run: npm run check
      - name: Bootstrap D1 and deploy Worker
        run: npm run bootstrap:remote
      - name: Resolve Worker URL and health check
        id: health
        shell: bash
        run: |
          set -e
          deploy_out="$(npx wrangler deployments status 2>&1 || true)"
          echo "$deploy_out"
          worker_url="$(printf '%s\n' "$deploy_out" | grep -Eo 'https://[^ ]+\.workers\.dev' | head -n1 || true)"
          if [ -z "$worker_url" ]; then
            worker_url="https://tyama-core.workers.dev"
          fi
          health="$(curl -fsS "$worker_url/health")"
          printf '%s' "$health" | grep -q '"ok":true'
          printf '{"status":"PASS","sha":"%s","run_id":"%s","worker_url":"%s","updated_at":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$worker_url" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ../.tyama-cloudflare-remote.json
      - name: Publish remote status
        working-directory: .
        shell: bash
        run: |
          set -e
          git config user.name 'tyama-ci'
          git config user.email 'tyama-ci@users.noreply.github.com'
          git add .tyama-cloudflare-remote.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update TYAMA Cloudflare remote status'
          for attempt in 1 2; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            test "$attempt" -lt 2
          done
