name: TYAMA Cloudflare remote bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tyama-cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TYAMA_REMOTE_ENV: acceptance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Cloudflare credentials are configured
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - name: Install
        run: npm install
      - name: Validate locally before remote mutation
        run: npm run check
      - name: Bootstrap acceptance D1 and deploy Worker
        shell: bash
        run: |
          set -o pipefail
          npm run bootstrap:remote 2>&1 | tee ../tyama-cloudflare-remote-deploy.log
      - name: Resolve Worker URL
        id: worker
        shell: bash
        run: |
          set -e
          worker_url="$(grep -Eo 'https://[^ ]+\.workers\.dev' ../tyama-cloudflare-remote-deploy.log | tail -n1 || true)"
          test -n "$worker_url" || { echo 'Could not resolve workers.dev URL from Wrangler deploy output'; exit 1; }
          echo "url=$worker_url" >> "$GITHUB_OUTPUT"
          curl --fail --silent --show-error --retry 4 --retry-delay 2 "$worker_url/health" | grep -q '"ok":true'
      - name: Create ephemeral acceptance Host session
        shell: bash
        run: |
          set -e
          token="$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::$token"
          echo "TYAMA_ACCEPTANCE_SESSION_TOKEN=$token" >> "$GITHUB_ENV"
          hash="$(node -e "const c=require('crypto'); console.log(c.createHash('sha256').update(process.argv[1]).digest('hex'))" "$token")"
          npx wrangler d1 execute tyama-core-acceptance --remote --env acceptance --command "INSERT OR REPLACE INTO hosts (id,email,display_name) VALUES ('host_acceptance_ci','acceptance-ci@tyama.local','Acceptance CI'); INSERT OR REPLACE INTO sessions (id,host_id,token_hash,expires_at) VALUES ('session_acceptance_ci','host_acceptance_ci','$hash',datetime('now','+2 hours'));"
      - name: Run remote core E2E
        env:
          TYAMA_REMOTE_BASE: ${{ steps.worker.outputs.url }}
        run: node ./scripts/smoke-remote.mjs
      - name: Cleanup acceptance CI data
        if: always()
        shell: bash
        run: |
          npx wrangler d1 execute tyama-core-acceptance --remote --env acceptance --command "DELETE FROM hosts WHERE id='host_acceptance_ci';" || true
      - name: Write remote PASS status
        if: success()
        shell: bash
        run: |
          printf '{"status":"PASS","sha":"%s","run_id":"%s","environment":"acceptance","worker_url":"%s","updated_at":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "${{ steps.worker.outputs.url }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ../.tyama-cloudflare-remote.json
      - name: Publish remote status
        if: success()
        working-directory: .
        shell: bash
        run: |
          set -e
          git config user.name 'tyama-ci'
          git config user.email 'tyama-ci@users.noreply.github.com'
          git add .tyama-cloudflare-remote.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update TYAMA Cloudflare remote status'
          for attempt in 1 2; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            test "$attempt" -lt 2
          done
