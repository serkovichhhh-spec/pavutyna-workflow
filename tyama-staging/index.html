<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ТЯМА — staging</title><style>:root{--c:#F4F0E8;--i:#18201F;--d:#214A4F;--g:#DDB33D;--m:#D8E2DE}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--i);font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{height:72px;border-bottom:1px solid #ccd6d2;display:flex;align-items:center;justify-content:space-between;padding:0 4vw}.logo{font-weight:900;font-size:28px;letter-spacing:.12em}.logo b{color:var(--g)}main{width:min(1180px,92vw);margin:auto;padding:42px 0}.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:center;min-height:70vh}.panel,.card{background:#fff;border:1px solid #d3ddd9;border-radius:16px;padding:24px}.brand{background:var(--i);color:var(--c);border-radius:18px;padding:42px}.brand h1{font-size:52px;line-height:1.05}.btn{border:0;border-radius:12px;min-height:48px;padding:0 18px;font-weight:700}.primary{background:var(--g);color:var(--i)}.ink{background:var(--i);color:#fff}.ghost{background:transparent;border:1px solid #bcc9c4}.grid{display:grid;gap:16px}.cols{grid-template-columns:repeat(2,1fr)}.events{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.event h2{font-size:30px;margin:6px 0}.muted{color:#66716e}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{padding:10px 14px;border:1px solid #bdc9c4;border-radius:999px;background:transparent}.tab.active{background:var(--i);color:#fff}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.field{display:grid;gap:7px;margin:12px 0}.field input,.field textarea,.field select{min-height:48px;border:1px solid #b8c5c0;border-radius:10px;padding:10px;background:#fff;width:100%}.field textarea{min-height:100px}.kit{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:var(--m);font-size:12px}.live{background:var(--d);color:#fff}.screen{min-height:100vh;background:var(--d);color:#fff;padding:5vw;display:flex;flex-direction:column;justify-content:center}.screen h1{font-size:7vw}.q{width:min(720px,92vw);margin:auto;padding:28px 0}.error{border-left:4px solid var(--g)}a{color:var(--d)}@media(max-width:760px){.hero,.events,.kit,.cols{grid-template-columns:1fr}.brand h1{font-size:40px}main{padding:24px 0}.row{align-items:flex-start;flex-wrap:wrap}}</style></head><body><div id="app"></div><script>const API='https://mmntbwgiwrctvhupksyh.supabase.co/functions/v1/tyama-staging-cors',A=document.querySelector('#app'),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const base=()=>location.href.split('#')[0],route=()=>location.hash.replace(/^#/,'')||'/';function nav(p){location.hash=p}window.addEventListener('hashchange',render);async function api(p,o={}){let r=await fetch(API+p,{...o,headers:{'content-type':'application/json',...(o.headers||{})},body:o.body&&typeof o.body!=='string'?JSON.stringify(o.body):o.body});let t=await r.text(),d;try{d=JSON.parse(t)}catch{throw Error('Некоректна відповідь staging API')}if(!r.ok)throw Error(d.error||'Помилка');return d}function top(x=''){return '<div class="top"><div class="logo">Т<b>Я</b>МА</div>'+x+'</div>'}function fail(e){A.innerHTML=top()+'<main><div class="card error"><h2>Не вдалося завантажити екран</h2><p>'+E(e.message||e)+'</p><button class="btn primary" id="home">На головну</button></div></main>';home.onclick=()=>nav('/')}function home(){A.innerHTML='<main class="hero"><section class="brand"><div class="logo">Т<b>Я</b>МА</div><h1>Контекст, готовий до роботи на події.</h1><p>Інтелект-сервіс для ведучих.</p></section><section class="panel"><h2>Вхід для ведучого</h2><p class="muted">Staging v0.1. Пароль не потрібен.</p><button class="btn primary" id="demo">Відкрити демо-подію</button></section></main>';demo.onclick=()=>{localStorage.tyama='1';nav('/host')}}async function dash(){let d=await api('/api/events');A.innerHTML=top('<button class="btn ghost" id="out">Вийти</button>')+'<main><div class="row"><div><small>КАБІНЕТ ВЕДУЧОГО</small><h1>Ваші події</h1></div><button class="btn primary" id="newE">Нова подія</button></div><section class="events">'+d.events.map(e=>'<article class="card event"><div class="muted">'+E(e.date||'Дата не вказана')+'</div><h2>'+E(e.title)+'</h2><p>'+E(e.venue||e.type)+'</p><p>'+e.metrics.responses+' відповідей · '+e.metrics.approved+' відібрано</p><button class="btn ink" data-e="'+e.id+'">Відкрити подію</button></article>').join('')+'</section></main>';out.onclick=()=>{localStorage.removeItem('tyama');nav('/')};document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>nav('/host/event/'+b.dataset.e));newE.onclick=()=>{let title=prompt('Назва події?');if(title)api('/api/events',{method:'POST',body:{title,type:'Подія'}}).then(d=>nav('/host/event/'+d.event.id)).catch(fail)}}function tabs(t){return '<div class="tabs">'+['overview:Огляд','questionnaire:Анкета','responses:Відповіді','kit:Event Kit','rehearsal:Репетиція','live:Live'].map(x=>{let[k,l]=x.split(':');return '<button class="tab '+(k===t?'active':'')+'" data-t="'+k+'">'+l+'</button>'}).join('')+'</div>'}async function event(id,t){let d=await api('/api/events/'+id),c='';if(t==='overview')c='<div class="grid cols"><div class="card"><h2>Готовність</h2><p>'+d.event.metrics.readiness+'%</p><p>'+d.event.metrics.responses+' відповідей</p><p>'+d.event.metrics.approved+' відібрано</p></div><div class="card"><h2>Наступна дія</h2><p>'+E(d.event.attention[0]||'Можна рухатися далі')+'</p></div></div>';if(t==='questionnaire'){let link=base()+'#/q/'+d.event.questionnaireToken;c='<div class="card"><div class="row"><h2>Анкета</h2><button class="btn primary" id="saveQ">Зберегти</button></div><p><a target="_blank" href="'+link+'">Відкрити public questionnaire</a></p>'+d.questionnaire.questions.map((q,i)=>'<div class="field"><label>'+E(q.label)+'</label><input data-qi="'+i+'" value="'+E(q.label)+'"></div>').join('')+'</div>'}if(t==='responses')c='<div class="grid">'+d.responses.map(r=>'<div class="card"><b>'+E(r.respondentLabel)+'</b><p class="muted">'+E(r.submittedAt)+'</p></div>').join('')+'</div>';if(t==='kit')c='<div class="kit">'+d.kit.map(x=>'<article class="card"><span class="pill">'+E(x.category)+'</span><h3>'+E(x.title)+'</h3><p>'+E(x.body)+'</p><select data-priv="'+x.id+'"><option value="review_required" '+(x.privacy==='review_required'?'selected':'')+'>Потрібна перевірка</option><option value="host_only" '+(x.privacy==='host_only'?'selected':'')+'>Тільки ведучому</option><option value="public_allowed" '+(x.privacy==='public_allowed'?'selected':'')+'>Можна публічно</option></select><p><button class="btn ink" data-ap="'+x.id+'">'+(x.status==='approved'?'Відібрано':'Відібрати')+'</button></p></article>').join('')+'</div>';if(t==='rehearsal')c='<div class="card"><h2>Репетиція</h2>'+d.kit.filter(x=>x.status==='approved').map(x=>'<div class="row"><span>'+E(x.title)+'</span><button class="btn ghost" data-r="'+x.id+'">Готово</button></div>').join('')+'</div>';if(t==='live'){let url=base()+'#/screen/'+d.event.publicToken;c='<div class="grid cols"><div class="card live"><h2>Зараз бачить аудиторія</h2><p>'+E((d.kit.find(x=>x.id===d.live.currentItemId)||{}).title||'Екран очищено')+'</p><p><a target="_blank" href="'+url+'" style="color:#fff">Відкрити Public Screen</a></p><button class="btn primary" id="blank">Очистити екран</button></div><div class="card"><h2>Дозволений матеріал</h2>'+d.kit.filter(x=>x.status==='approved'&&x.privacy==='public_allowed').map(x=>'<div class="row"><span>'+E(x.title)+'</span><button class="btn ink" data-show="'+x.id+'">Показати</button></div>').join('')+'</div></div>'}A.innerHTML=top('<button class="btn ghost" id="back">Усі події</button>')+'<main><h1>'+E(d.event.title)+'</h1>'+tabs(t)+c+'</main>';back.onclick=()=>nav('/host');document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>nav('/host/event/'+id+'?tab='+b.dataset.t));let save=document.querySelector('#saveQ');if(save)save.onclick=async()=>{let qs=d.questionnaire.questions.map((q,i)=>({...q,label:document.querySelector('[data-qi="'+i+'"]')?.value||q.label}));await api('/api/events/'+id+'/questionnaire',{method:'PUT',body:{questions:qs}});alert('Збережено')};document.querySelectorAll('[data-priv]').forEach(s=>s.onchange=()=>api('/api/events/'+id+'/kit/'+s.dataset.priv,{method:'PATCH',body:{privacy:s.value}}).catch(fail));document.querySelectorAll('[data-ap]').forEach(b=>b.onclick=async()=>{await api('/api/events/'+id+'/kit/'+b.dataset.ap,{method:'PATCH',body:{status:'approved'}});render()});document.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{await api('/api/events/'+id+'/rehearsal',{method:'PATCH',body:{itemId:b.dataset.r,state:'ready'}});b.textContent='Готово ✓'});let blank=document.querySelector('#blank');if(blank)blank.onclick=()=>api('/api/events/'+id+'/live',{method:'POST',body:{action:'blank'}}).then(render).catch(fail);document.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>api('/api/events/'+id+'/live',{method:'POST',body:{action:'show_item',itemId:b.dataset.show}}).then(render).catch(fail))}async function q(token){let d=await api('/api/public/questionnaire/'+token),q=d.questionnaire;A.innerHTML='<main class="q"><div class="logo">Т<b>Я</b>МА</div><h1>'+E(q.title)+'</h1><p>'+E(q.intro)+'</p><form class="card" id="f">'+q.questions.map((x,i)=>'<div class="field"><label>'+E(x.label)+(x.required?' *':'')+'</label>'+(x.type==='textarea'?'<textarea name="q'+i+'" '+(x.required?'required':'')+'></textarea>':x.type==='select'?'<select name="q'+i+'" '+(x.required?'required':'')+'><option></option>'+x.options.map(o=>'<option>'+E(o)+'</option>').join('')+'</select>':'<input name="q'+i+'" '+(x.required?'required':'')+'>')+'</div>').join('')+'<button class="btn primary">Надіслати відповіді</button></form></main>';f.onsubmit=async e=>{e.preventDefault();let fd=new FormData(f),answers=q.questions.map((x,i)=>({questionId:x.id,value:fd.get('q'+i)||''}));await api('/api/public/questionnaire/'+token,{method:'POST',body:{answers}});A.innerHTML='<main class="q"><div class="card"><h1>Дякуємо. Контекст збережено.</h1></div></main>'}}async function screen(token){let draw=async()=>{let d=await api('/api/public/screen/'+token),x=d.live.current;A.innerHTML='<div class="screen"><div class="logo">Т<b>Я</b>МА</div>'+(x?'<h1>'+E(x.title)+'</h1><p style="font-size:3vw">'+E(x.body)+'</p>':'<h1>'+E(d.event.heroNames||d.event.title)+'</h1><p>Екран готовий.</p>')+'</div>'};await draw();clearInterval(window.t);window.t=setInterval(()=>draw().catch(()=>{}),1000)}async function render(){try{let p=route();if(p==='/')return home();if(p==='/host')return localStorage.tyama==='1'?dash():nav('/');let m=p.match(/^\/host\/event\/([^?]+)(?:\?tab=(.+))?$/);if(m)return localStorage.tyama==='1'?event(m[1],m[2]||'overview'):nav('/');m=p.match(/^\/q\/([^/]+)/);if(m)return q(m[1]);m=p.match(/^\/screen\/([^/]+)/);if(m)return screen(m[1]);home()}catch(e){fail(e)}}render();</script></body></html>
